services:
  caddy:
    build: ./caddy
    container_name: caddy
    user: "1000:1000"
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./configs/caddy:/etc/caddy:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
      - /mnt/storage/downloads/aria2:/srv/packages:ro

  jellyfin:
    image: jellyfin/jellyfin:12.4
    container_name: jellyfin
    user: "1000:1000"
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./data/jellyfin/config:/config
      - ./data/jellyfin/cache:/cache
      - /mnt/storage/media/movies:/media/torrentmovies:ro
      - /mnt/storage2/media/tv:/media/torrentshows:ro
    group_add:
      - "992" # render group
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128 # use system GPU
    extra_hosts:
      - "host.docker.internal:host-gateway" # necessary for docker healthcheck to pass if running in host network mode

  homer:
    image: b4bz/homer:v26.11.4
    container_name: homer
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - INIT_ASSETS=1
    volumes:
      - ./configs/homer:/www/assets:ro

  beszel:
    image: henrygd/beszel:0.21.2
    container_name: beszel
    restart: unless-stopped
    environment:
      APP_URL: http://hp-minipc:8090
    ports:
      - "8090:8090"
    volumes:
      - ./data/beszel/hub:/beszel_data
      - ./data/beszel/socket:/beszel_socket

  beszel-agent:
    image: henrygd/beszel-agent-intel:0.21.2
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data/beszel/agent:/var/lib/beszel-agent
      - ./data/beszel/socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/storage/.beszel:/extra-filesystems/sdb1:ro
      - /mnt/storage2/.beszel:/extra-filesystems/sda1:ro
      - ./secrets/beszel_token:/run/secrets/beszel_token:ro
      - ./secrets/beszel_key:/run/secrets/beszel_key:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://hp-minipc:8090
      TOKEN_FILE: /run/secrets/beszel_token
      KEY_FILE: /run/secrets/beszel_key
    cap_add:
      - CAP_PERFMON
      - SYS_RAWIO # required for S.M.A.R.T. data
      - SYS_ADMIN # required for NVMe S.M.A.R.T. data
    devices:
      - /dev/dri/card0:/dev/dri/card0
      - /dev/sda:/dev/sda
      - /dev/sdb://dev/sdb
      - /dev/nvme0:/dev/nvme0

  forgejo:
    image: codeberg.org/forgejo/forgejo:17.0.2-rootless
    container_name: forgejo
    user: "1000:1000"
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__server__SSH_PORT=222
    ports:
      - "3000:3000"
      - "222:2222"
    volumes:
      - ./data/forgejo:/var/lib/gitea
      - /etc/localtime:/etc/localtime:ro

  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4
    container_name: radarr
    restart: unless-stopped
    ports:
      - "7878:7878"
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ./data/radarr:/config
      - /mnt/storage:/data

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20
    container_name: sonarr
    restart: unless-stopped
    ports:
      - "8989:8989"
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ./data/sonarr:/config
      - /mnt/storage2:/data

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.3.0-libtorrentv1 # libtorrent 1.2 for many continuously seeding torrents
    container_name: qbittorrent
    restart: unless-stopped
    ports:
      - "8081:8081" # WebUI
      - "6881:6881/tcp" # Keep in sync with TORRENTING_PORT and scripts/check_qbit.sh
      - "6881:6881/udp"
    environment:
      - PUID=1000
      - PGID=1000
      - WEBUI_PORT=8081
      - TORRENTING_PORT=6881
    volumes:
      - ./data/qbittorrent:/config
      - /mnt/storage/downloads/torrents/radarr:/data/downloads/torrents/radarr
      - /mnt/storage2/downloads/torrents/sonarr:/data/downloads/torrents/sonarr

  aria2:
    build: ./aria2
    container_name: aria2
    restart: unless-stopped
    ports:
      - "6800:6800"
    volumes:
      - ./configs/aria2/aria2.conf:/etc/aria2/aria2.conf:ro
      - ./secrets/aria2_token:/run/secrets/aria2_token:ro
      - /mnt/storage/downloads/aria2:/downloads
