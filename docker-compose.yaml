services:
  caddy:
    image: caddy:2.11.9
    container_name: caddy
    user: "1000:1000"
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./configs/caddy:/etc/caddy:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config

  jellyfin:
    image: jellyfin/jellyfin:12.4
    container_name: jellyfin
    user: "1000:1000"
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./data/jellyfin/config:/config
      - ./data/jellyfin/cache:/cache
      - /mnt/storage/media/movies:/media/torrentmovies:ro
      - /mnt/storage2/media/tv:/media/torrentshows:ro
    group_add:
      - "992" # render group
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128 # use system GPU
    extra_hosts:
      - "host.docker.internal:host-gateway" # necessary for docker healthcheck to pass if running in host network mode

  homer:
    image: b4bz/homer:v26.11.4
    container_name: homer
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - INIT_ASSETS=1
    volumes:
      - ./configs/homer:/www/assets:ro

  forgejo:
    image: codeberg.org/forgejo/forgejo:17.0.2-rootless
    container_name: forgejo
    user: "1000:1000"
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__server__SSH_PORT=222
    ports:
      - "3000:3000"
      - "222:2222"
    volumes:
      - ./data/forgejo:/var/lib/gitea
      - /etc/localtime:/etc/localtime:ro

  radarr:
    image: lscr.io/linuxserver/radarr:7.0.3
    container_name: radarr
    restart: unless-stopped
    ports:
      - "7878:7878"
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ./data/radarr:/config
      - /mnt/storage:/data

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20
    container_name: sonarr
    restart: unless-stopped
    ports:
      - "8989:8989"
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ./data/sonarr:/config
      - /mnt/storage2:/data

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.3.0-libtorrentv1 # libtorrent 1.2 for many continuously seeding torrents
    container_name: qbittorrent
    restart: unless-stopped
    ports:
      - "8081:8081" # WebUI
      - "6881:6881/tcp" # Keep in sync with TORRENTING_PORT and scripts/check_qbit.sh
      - "6881:6881/udp"
    environment:
      - PUID=1000
      - PGID=1000
      - WEBUI_PORT=8081
      - TORRENTING_PORT=6881
    volumes:
      - ./data/qbittorrent:/config
      - /mnt/storage/downloads/torrents/radarr:/data/downloads/torrents/radarr
      - /mnt/storage2/downloads/torrents/sonarr:/data/downloads/torrents/sonarr
